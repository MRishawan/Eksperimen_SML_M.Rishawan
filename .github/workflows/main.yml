name: Data Preprocessing Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-preprocessing:
    name: Run Data Preprocessing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas numpy scikit-learn; fi

      - name: Execute Preprocessing Script
        run: python "src/automate_M Rishawan.py"

      - name: Upload Processed Datasets as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-california-housing-data
          path: |
            data/housing_train_preprocessing.csv
            data/housing_test_preprocessing.csv
          retention-days: 7
